*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#203c34;font-family:"DM Sans","Noto Sans TC",system-ui,sans-serif}header,main{max-width:1180px;margin:auto;padding:0 28px}header{height:70px;display:flex;align-items:center;gap:12px;font-size:21px;font-weight:800}header small{margin-left:auto;font-size:14px;color:#586d62}.logo{background:#214d3f;color:white;padding:5px 9px;border-radius:9px}main{padding-bottom:40px}.hero{isolation:isolate;position:relative;overflow:hidden;background:#20483c;border-radius:18px;color:#fff9e7;padding:38px 34px;min-height:184px}.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.hero h1{font-size:clamp(33px,5vw,54px);margin:6px 0;letter-spacing:.04em}.hero p{margin:0;color:#e4eadc}.eyebrow{font:700 12px/1.5 monospace;letter-spacing:.18em;color:#d4e5aa}.box,form,.metric{background:#fff;border:1px solid #dce2d9;border-radius:14px}form{display:flex;align-items:end;flex-wrap:wrap;gap:14px;padding:20px;margin:16px 0}label{font-weight:650;font-size:15px;display:grid;gap:6px}.place{flex:1;min-width:min(235px,100%)}input,button,select{font:inherit;border-radius:8px;padding:10px 12px;border:1px solid #cdd7cd;background:white;color:inherit;min-height:44px;max-width:100%}button{cursor:pointer;font-weight:650}button:hover{background:#e8eee5}.primary{background:#264f40;color:white;border-color:#264f40}.primary:hover{background:#38644f}#searchInfo:empty,#choices:empty{display:none}#choices{display:flex;flex-wrap:wrap;gap:6px}h2{font-size:23px;margin:0}h3{margin:0}.heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 12px}.meta,footer{font-size:14px;color:#596c60}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:18px;border-top:3px solid var(--a)}.icon{font-size:22px;color:var(--a);display:inline-grid;place-items:center;background:var(--bg);border-radius:10px;width:36px;height:36px;margin-right:8px}.value{font-size:36px;font-weight:700;line-height:1.5}.unit{font-size:16px;margin-left:5px;color:#63736b}.box{padding:20px;margin-top:16px}.hourHead{display:flex;align-items:center;gap:12px}.hourHead output{font-size:1.55rem;font-weight:750;color:#245b46;font-variant-numeric:tabular-nums}#hour{width:100%;padding:0;margin:4px 0 0;cursor:pointer;accent-color:#275e49;display:block}#ticks{position:relative;margin:0 9px 22px;height:20px;font:14px/1.3 system-ui;color:#566b5f}#ticks span{position:absolute;transform:translateX(-50%)}#ticks span:first-child{transform:none}#ticks span:last-child{transform:translateX(-100%)}#forecastMetrics .metric{background:#f8faf6}a{color:#295f4c}.quake{border-left:5px solid #809176}.alert{border-left-color:#cb741c;background:#fff8eb}footer{margin-top:18px}p{line-height:1.55}#coords{overflow-wrap:anywhere}@media(max-width:720px){header,main{padding-left:15px;padding-right:15px}.hero{padding:26px 18px}.metrics{grid-template-columns:1fr 1fr}.metric{padding:13px}form{gap:10px}.place{flex-basis:100%}header small{font-size:12px}.hero p{max-width:210px}.box{padding:14px}}
.fine{display:flex;gap:8px;margin:0 0 14px}.fine button:disabled{opacity:.45;cursor:default}#dates{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:16px}#dates button{padding:6px 2px;font-variant-numeric:tabular-nums}#dates button[aria-pressed=true]{color:white;background:#265140;border-color:#265140}.hourHead{flex-wrap:wrap;margin:8px 0}.hourHead output{font-size:clamp(16px,3vw,24px)}#phase{border-radius:14px;padding:3px 10px;font-size:14px;font-weight:650}.sun{background:#f4cf76;color:#61410a}.moon{background:#48597c;color:white}#bands{display:flex;margin:14px 8px 0;overflow:hidden;border-radius:5px;background:#ddd}#bands i{flex:1;height:12px}#ticks{display:block;position:relative;margin:0 8px 12px;font-variant-numeric:tabular-nums}#ticks small:first-child{transform:none}#ticks small:last-child{transform:translateX(-100%)}#ticks small{position:absolute;transform:translateX(-50%);font-size:clamp(10px,2.8vw,13px)}#hour{margin-top:-2px}</style><header><span class="logo" aria-hidden="true">⌁</span>山野氣象站<small>露營天氣監控</small></header><main><div class="hero"><canvas id="art"></canvas><span class="eyebrow">CAMP WEATHER</span><h1>營地天氣總覽</h1><p>掌握山間風雨，安排這一趟露營。</p></div>
<form id="form"><label class="place">營區位置<input id="place" placeholder="營區名稱、Google 地圖網址或座標" required></label><button type="button" id="maps">Google 地圖搜尋</button><button type="button" id="gps">◎ 目前位置</button><label>露營日期<input type="date" id="day" required></label><button class="primary">查詢天氣</button></form><p role="status" id="searchInfo"></p><div id="choices"></div>
